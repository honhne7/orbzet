<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0d10;color:#e6e8eb;font-family:Geist,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#e6e8eb;text-decoration:none}a:hover{color:oklch(0.8 0.13 75)}
select,input{font:inherit}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;font-size:13px">
  <header style="display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid #1c2027">
    <a href="index.html" style="display:flex;align-items:center;gap:10px">
      <div style="width:22px;height:22px;background:oklch(0.8 0.13 75);border-radius:50%;box-shadow:inset 0 0 0 5px #0b0d10, 0 0 0 1px oklch(0.8 0.13 75)"></div>
      <span style="font-weight:600;font-size:15px;letter-spacing:-0.01em">Orbzet</span>
    </a>
    <nav style="display:flex;gap:4px;flex-wrap:wrap">
      <a href="overview.html" style="padding:6px 10px;border-radius:6px;color:#8a919c">Overview</a>
      <a href="funding.html" style="padding:6px 10px;border-radius:6px;color:#8a919c">Funding Rates</a>
      <a href="price-spread.html" style="padding:6px 10px;border-radius:6px;color:#8a919c">Price Spread</a>
      <a href="funding-price.html" style="padding:6px 10px;border-radius:6px;color:#8a919c">Funding / Price</a>
      <a href="backtest.html" style="padding:6px 10px;border-radius:6px;background:#161a20;color:#e6e8eb">Backtest</a>
      <a href="exchanges.html" style="padding:6px 10px;border-radius:6px;color:#8a919c">Exchanges</a>
    </nav>
  </header>

  <div style="display:flex;flex-wrap:wrap;flex:1">
    <aside style="flex:0 1 300px;min-width:260px;border-right:1px solid #1c2027;padding:20px 24px;display:flex;flex-direction:column;gap:18px">
      <span style="color:#7d848f;font-size:11px;text-transform:uppercase;letter-spacing:0.06em">Strategy</span>
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="color:#8a919c;font-size:12px">Coin</span>
        <select onChange="{{ onCoin }}" style="background:#111419;border:1px solid #232831;border-radius:6px;color:#e6e8eb;padding:7px 9px">
          <sc-for list="{{ coinOpts }}" as="o" hint-placeholder-count="6"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.v }}</option></sc-for>
        </select>
      </label>
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="color:oklch(0.78 0.14 155);font-size:12px">Long venue</span>
        <select onChange="{{ onLong }}" style="background:#111419;border:1px solid #232831;border-radius:6px;color:#e6e8eb;padding:7px 9px">
          <sc-for list="{{ longOpts }}" as="o" hint-placeholder-count="6"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.v }}</option></sc-for>
        </select>
      </label>
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="color:oklch(0.76 0.14 25);font-size:12px">Short venue</span>
        <select onChange="{{ onShort }}" style="background:#111419;border:1px solid #232831;border-radius:6px;color:#e6e8eb;padding:7px 9px">
          <sc-for list="{{ shortOpts }}" as="o" hint-placeholder-count="6"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.v }}</option></sc-for>
        </select>
      </label>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="color:#8a919c;font-size:12px">Period</span>
        <div style="display:flex;gap:2px;padding:2px;background:#111419;border:1px solid #1c2027;border-radius:7px">
          <sc-for list="{{ periods }}" as="p" hint-placeholder-count="3">
            <button onClick="{{ p.onClick }}" style="flex:1;border:0;cursor:pointer;padding:5px 0;border-radius:5px;font:inherit;font-size:12px;background:{{ p.bg }};color:{{ p.color }}">{{ p.label }}</button>
          </sc-for>
        </div>
      </div>
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="color:#8a919c;font-size:12px">Position size (USD)</span>
        <input value="{{ size }}" onChange="{{ onSize }}" style="background:#111419;border:1px solid #232831;border-radius:6px;color:#e6e8eb;padding:7px 9px;font-family:'Geist Mono',monospace;outline:none">
      </label>
    </aside>

    <main style="flex:1 1 560px;min-width:0;padding:20px 24px;display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
        <span style="font-size:24px;font-weight:600;letter-spacing:-0.02em">{{ coin }}</span>
        <span style="color:#8a919c">{{ pairTxt }}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:#1c2027;border:1px solid #1c2027;border-radius:8px;overflow:hidden">
        <sc-for list="{{ stats }}" as="k" hint-placeholder-count="4">
          <div style="background:#0f1216;padding:14px;display:flex;flex-direction:column;gap:4px">
            <span style="color:#7d848f;font-size:12px">{{ k.label }}</span>
            <span style="font-family:'Geist Mono',monospace;font-size:19px;color:{{ k.color }}">{{ k.value }}</span>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;color:#7d848f;font-size:12px"><span>Daily funding P&amp;L</span><span>{{ rangeTxt }}</span></div>
        <div style="height:220px;display:flex;align-items:center;gap:2px;border-top:1px solid #1c2027;border-bottom:1px solid #1c2027;position:relative">
          <div style="position:absolute;left:0;right:0;top:50%;border-top:1px dashed #232831"></div>
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="30">
            <div title="{{ b.t }}" style="flex:1;height:100%;display:flex;flex-direction:column">
              <div style="flex:1;display:flex;align-items:flex-end"><div style="width:100%;height:{{ b.up }};background:oklch(0.8 0.13 75);border-radius:1px 1px 0 0"></div></div>
              <div style="flex:1;display:flex;align-items:flex-start"><div style="width:100%;height:{{ b.dn }};background:oklch(0.76 0.14 25);border-radius:0 0 1px 1px"></div></div>
            </div>
          </sc-for>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <span style="color:#7d848f;font-size:12px">Cumulative P&amp;L</span>
        <div style="height:120px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid #1c2027">
          <sc-for list="{{ cum }}" as="c" hint-placeholder-count="30">
            <div style="flex:1;height:{{ c.h }};background:oklch(0.8 0.13 75 / 0.35);border-top:2px solid oklch(0.8 0.13 75)"></div>
          </sc-for>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  EX = ['Hyperliquid','Binance','Bybit','Lighter','Lighter RH','Arcus','Paradex','MEXC','Bitget','edgeX'];
  COINS = ['BTC','ETH','SOL','HYPE','TSLA','NVDA','XAU','DOGE'];
  state = { coin: 'SOL', longEx: 'Hyperliquid', shortEx: 'Binance', days: 30, size: '10000' };
  series() {
    const s = this.state;
    let seed = [...(s.coin + s.longEx + s.shortEx)].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) % 2147483647 || 1;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const drift = (rnd() - 0.3) * 0.05;
    return Array.from({ length: s.days }, () => (drift + (rnd() - 0.5) * 0.09) * 3);
  }
  renderVals() {
    const s = this.state, accent = 'oklch(0.8 0.13 75)';
    const size = parseFloat(String(s.size).replace(/[^0-9.]/g, '')) || 0;
    const daily = this.series().map(p => p / 100 * size);
    const max = Math.max(...daily.map(Math.abs), 1);
    let run = 0; const cumV = daily.map(d => (run += d));
    const cmin = Math.min(0, ...cumV), cmax = Math.max(...cumV, 1);
    let peak = -Infinity, dd = 0; cumV.forEach(v => { peak = Math.max(peak, v); dd = Math.min(dd, v - peak); });
    const total = run, wins = daily.filter(d => d > 0).length;
    const usd = v => (v < 0 ? '−$' : '$') + Math.abs(v).toFixed(2);
    const apr = size ? total / size / s.days * 365 * 100 : 0;
    return {
      ...s,
      coinOpts: this.COINS.map(v => ({ v, sel: v === s.coin })), longOpts: this.EX.map(v => ({ v, sel: v === s.longEx })), shortOpts: this.EX.map(v => ({ v, sel: v === s.shortEx })),
      onCoin: e => this.setState({ coin: e.target.value }),
      onLong: e => this.setState({ longEx: e.target.value }),
      onShort: e => this.setState({ shortEx: e.target.value }),
      onSize: e => this.setState({ size: e.target.value }),
      pairTxt: `Long ${s.longEx} · Short ${s.shortEx} · last ${s.days} days`,
      rangeTxt: `Max day ${usd(Math.max(...daily))}`,
      periods: [[7, '7D'], [30, '30D'], [90, '90D']].map(([v, l]) => ({ label: l, bg: s.days === v ? '#1f242c' : 'transparent', color: s.days === v ? '#e6e8eb' : '#8a919c', onClick: () => this.setState({ days: v }) })),
      stats: [
        { label: 'Total P&L', value: usd(total), color: total >= 0 ? accent : 'oklch(0.76 0.14 25)' },
        { label: 'Annualized', value: apr.toFixed(1) + '%', color: '#e6e8eb' },
        { label: 'Win days', value: `${wins}/${s.days}`, color: '#e6e8eb' },
        { label: 'Max drawdown', value: usd(dd), color: '#e6e8eb' }
      ],
      bars: daily.map((d, i) => ({ up: d > 0 ? (d / max * 100) + '%' : '0', dn: d < 0 ? (-d / max * 100) + '%' : '0', t: `Day ${i + 1}: ${usd(d)}` })),
      cum: cumV.map(v => ({ h: Math.max(2, (v - cmin) / (cmax - cmin) * 100) + '%' }))
    };
  }
}
</script>
</body>
</html>
